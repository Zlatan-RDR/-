name: Build Miqbas Android APK (.NET MAUI)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      - name: Restore NuGet Packages
        run: |
          dotnet restore src/Miqbas.Mobile/Miqbas.Mobile.csproj

      - name: Build & Publish Android APK
        env:
          CONFIG: ${{ github.event.inputs.build_configuration || 'Release' }}
        run: |
          echo "Building Miqbas.Mobile in $CONFIG mode..."
          dotnet publish src/Miqbas.Mobile/Miqbas.Mobile.csproj \
            -f net8.0-android \
            -c $CONFIG \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -o ./build-output

      - name: Locate & Rename APK Artifact
        id: prepare_apk
        run: |
          mkdir -p ./apk-release
          find ./build-output -name "*.apk" -exec cp {} ./apk-release/Miqbas-UnityPatcher-v1.0.apk \;
          if [ ! -f ./apk-release/Miqbas-UnityPatcher-v1.0.apk ]; then
            # Check bin directory if output folder was flattened
            find src/Miqbas.Mobile/bin -name "*Signed.apk" -o -name "*.apk" | head -n 1 | xargs -I {} cp {} ./apk-release/Miqbas-UnityPatcher-v1.0.apk
          fi
          ls -lh ./apk-release/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miqbas-UnityPatcher-Android-APK
          path: ./apk-release/Miqbas-UnityPatcher-v1.0.apk
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk-release/Miqbas-UnityPatcher-v1.0.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
