name: Build Miqbas Android APK (.NET MAUI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CheckEolWorkloads: 'false'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Restore Dependencies
        run: |
          dotnet restore src/Miqbas.Mobile/Miqbas.Mobile.csproj -p:CheckEolWorkloads=false

      - name: Build Android APK
        run: |
          dotnet publish src/Miqbas.Mobile/Miqbas.Mobile.csproj \
            -f net8.0-android \
            -c Release \
            -p:CheckEolWorkloads=false \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -o ./output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miqbas-UnityPatcher-Android-APK
          path: ./output/*.apk
